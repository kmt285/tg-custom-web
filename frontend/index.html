<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Telegram Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Telegram Login</h2>

        <div id="messageBox" class="mb-4 text-center text-sm font-semibold hidden"></div>

        <div id="phoneSection">
            <label class="block text-gray-700 text-sm font-bold mb-2">Phone Number</label>
            <input type="text" id="phoneNumber" placeholder="+959..." class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-4">
            <button id="sendCodeBtn" onclick="requestOTP()" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-200">
                Get Code
            </button>
        </div>

        <div id="otpSection" class="hidden">
            <p class="text-sm text-gray-600 mb-4 text-center">We've sent a code to your Telegram app.</p>
            <label class="block text-gray-700 text-sm font-bold mb-2">Confirmation Code</label>
            <input type="text" id="otpCode" placeholder="12345" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-4">
            <button id="verifyBtn" onclick="verifyOTP()" class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-200">
                Login
            </button>
        </div>
    </div>

    <script>
        // ⚠️ သတိပြုရန် - အောက်ပါ URL ကို သင်၏ Render URL ဖြင့် အတိအကျ အစားထိုးပါ။
        const API_BASE_URL = ""https://telegram-7ih3.onrender.com/api/auth";"; 
        
        let phoneCodeHashGlobal = "";
        let phoneNumberGlobal = "";

        // Message ပြသရန် Function
        function showMessage(msg, isError = false) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = msg;
            msgBox.className = `mb-4 text-center text-sm font-semibold p-2 rounded ${isError ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`;
            msgBox.classList.remove('hidden');
        }

        // ၁။ OTP လှမ်းတောင်းမည့် Function
        async function requestOTP() {
            const phoneInput = document.getElementById('phoneNumber').value.trim();
            if (!phoneInput) return showMessage("Please enter a valid phone number", true);

            const btn = document.getElementById('sendCodeBtn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phoneInput })
                });

                const data = await response.json();

                if (data.success) {
                    phoneCodeHashGlobal = data.phoneCodeHash;
                    phoneNumberGlobal = phoneInput;
                    
                    // UI ပြောင်းရန် (ဖုန်းနံပါတ်ဖျောက်ပြီး OTP ပေါ်ရန်)
                    document.getElementById('phoneSection').classList.add('hidden');
                    document.getElementById('otpSection').classList.remove('hidden');
                    showMessage("Code sent successfully!");
                } else {
                    showMessage(data.error || "Failed to send code", true);
                    btn.innerText = "Get Code";
                    btn.disabled = false;
                }
            } catch (error) {
                showMessage("Network Error. Is the backend running?", true);
                btn.innerText = "Get Code";
                btn.disabled = false;
            }
        }

        // ၂။ OTP စစ်ဆေးမည့် Function
        async function verifyOTP() {
            const codeInput = document.getElementById('otpCode').value.trim();
            if (!codeInput) return showMessage("Please enter the code", true);

            const btn = document.getElementById('verifyBtn');
            btn.innerText = "Verifying...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/verify-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: phoneNumberGlobal,
                        phoneCodeHash: phoneCodeHashGlobal,
                        code: codeInput
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`Login successful! Role: ${data.role}`);
                    // Login အောင်မြင်ပါက User Data ကို Browser တွင် သိမ်းမည်
                    localStorage.setItem('userPhone', phoneNumberGlobal);
                    localStorage.setItem('userRole', data.role);
                    
                    // နောက်ပိုင်းမှာ Chat Page ဆီ Redirect လုပ်ရန် ဒီနေရာတွင် ရေးရမည်
                    setTimeout(() => {
                        alert("Login Complete! Ready for next step.");
                    }, 1000);
                } else {
                    showMessage(data.error || "Invalid code", true);
                    btn.innerText = "Login";
                    btn.disabled = false;
                }
            } catch (error) {
                showMessage("Network Error.", true);
                btn.innerText = "Login";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Custom Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-200 h-screen overflow-hidden font-sans">

    <div id="messageBox" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 text-sm font-semibold px-4 py-2 rounded shadow-lg hidden transition-all"></div>

    <div id="loginView" class="flex items-center justify-center h-full">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Telegram Login</h2>
            
            <div id="phoneSection">
                <label class="block text-gray-700 text-sm font-bold mb-2">Phone Number</label>
                <input type="text" id="phoneNumber" placeholder="+959..." class="border rounded w-full py-2 px-3 text-gray-700 mb-4">
                <button id="sendCodeBtn" onclick="requestOTP()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Get Code</button>
            </div>

            <div id="otpSection" class="hidden mt-4">
                <p class="text-sm text-gray-600 mb-4 text-center">Code sent to Telegram.</p>
                <label class="block text-gray-700 text-sm font-bold mb-2">Code</label>
                <input type="text" id="otpCode" placeholder="12345" class="border rounded w-full py-2 px-3 text-gray-700 mb-4">
                <button id="verifyBtn" onclick="verifyOTP()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">Login</button>
            </div>
        </div>
    </div>

    <div id="mainAppView" class="hidden h-full flex max-w-6xl mx-auto shadow-2xl bg-white">
        
        <div class="w-1/3 border-r border-gray-200 flex flex-col bg-white">
            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-700">Chats</h3>
                <button onclick="logout()" class="text-xs text-red-500 hover:underline">Logout</button>
            </div>
            <div id="chatLoading" class="p-4 text-center text-gray-500 text-sm">Loading chats...</div>
            <ul id="chatList" class="flex-1 overflow-y-auto divide-y divide-gray-100"></ul>
        </div>

        <div class="w-2/3 flex flex-col bg-[#e5ddd5]">
            <div class="p-4 bg-gray-50 border-b flex items-center shadow-sm z-10">
                <h3 id="activeChatName" class="font-bold text-lg text-gray-800">Select a chat</h3>
            </div>
            
            <div id="messageArea" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="text-center text-gray-500 mt-10">Messages will appear here</div>
            </div>

            <div id="inputArea" class="p-4 bg-gray-50 border-t flex items-center gap-2 hidden">
                <input type="text" id="msgInput" placeholder="Type a message..." class="flex-1 border border-gray-300 rounded-full py-2 px-4" onkeypress="handleEnter(event)">
                <button onclick="sendMsg()" class="bg-blue-500 text-white p-2 px-4 rounded-full font-bold">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "/api"; 
        let phoneCodeHashGlobal = "";
        let phoneNumberGlobal = localStorage.getItem('userPhone') || "";
        let currentChatId = null; 

        window.onload = () => { if (phoneNumberGlobal) showAppView(); };

        function showNotification(msg, isError = false) {
            const box = document.getElementById('messageBox');
            box.textContent = msg;
            box.className = `fixed top-4 left-1/2 transform -translate-x-1/2 z-50 text-sm font-semibold px-6 py-3 rounded shadow-lg ${isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3000);
        }

        function showAppView() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('mainAppView').classList.remove('hidden');
            document.getElementById('mainAppView').classList.add('flex');
            loadDialogs();
        }

        // --- AUTH ---
        async function requestOTP() {
            const phoneInput = document.getElementById('phoneNumber').value.trim();
            if (!phoneInput) return;
            document.getElementById('sendCodeBtn').innerText = "Sending...";
            try {
                const res = await fetch(`${API_BASE_URL}/auth/send-code`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phoneNumber: phoneInput }) });
                const data = await res.json();
                if (data.success) {
                    phoneCodeHashGlobal = data.phoneCodeHash; phoneNumberGlobal = phoneInput;
                    document.getElementById('phoneSection').classList.add('hidden'); document.getElementById('otpSection').classList.remove('hidden');
                } else showNotification(data.error, true);
            } catch (e) {} finally { document.getElementById('sendCodeBtn').innerText = "Get Code"; }
        }

        async function verifyOTP() {
            const codeInput = document.getElementById('otpCode').value.trim();
            if (!codeInput) return;
            document.getElementById('verifyBtn').innerText = "Verifying...";
            try {
                const res = await fetch(`${API_BASE_URL}/auth/verify-code`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phoneNumber: phoneNumberGlobal, phoneCodeHash: phoneCodeHashGlobal, code: codeInput }) });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('userPhone', phoneNumberGlobal); showAppView();
                } else showNotification(data.error, true);
            } catch (e) {} finally { document.getElementById('verifyBtn').innerText = "Login"; }
        }

        // --- CHAT LIST ---
        async function loadDialogs() {
            try {
                const res = await fetch(`${API_BASE_URL}/chat/dialogs?phoneNumber=${encodeURIComponent(phoneNumberGlobal)}`);
                const data = await res.json();
                document.getElementById('chatLoading').classList.add('hidden');
                if (data.success) {
                    const listEl = document.getElementById('chatList'); listEl.innerHTML = ""; 
                    data.chats.forEach(chat => {
                        const li = document.createElement('li');
                        li.className = "p-3 hover:bg-blue-50 cursor-pointer flex flex-col";
                        let typeIcon = chat.isChannel ? "📢" : (chat.isGroup ? "👥" : "👤");
                        li.onclick = () => openChat(chat.id, chat.title, chat.isChannel);
                        li.innerHTML = `
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-gray-800 text-sm truncate w-3/4">${typeIcon} ${chat.title || 'Unknown'}</span>
                                ${chat.unreadCount > 0 ? `<span class="bg-blue-500 text-white text-[10px] px-2 py-0.5 rounded-full">${chat.unreadCount}</span>` : ''}
                            </div>
                            <span class="text-xs text-gray-500 truncate">${chat.lastMessage || '...'}</span>
                        `;
                        listEl.appendChild(li);
                    });
                }
            } catch (e) {}
        }

        // --- MESSAGES & MEDIA ---
        async function openChat(chatId, chatTitle, isChannel) {
            currentChatId = chatId;
            document.getElementById('activeChatName').innerText = chatTitle;
            const inputArea = document.getElementById('inputArea');
            isChannel ? inputArea.classList.add('hidden') : inputArea.classList.remove('hidden');
            isChannel ? inputArea.classList.remove('flex') : inputArea.classList.add('flex');
            
            const msgArea = document.getElementById('messageArea');
            msgArea.innerHTML = `<div class="text-center text-gray-500 mt-4">Loading messages...</div>`;

            try {
                const res = await fetch(`${API_BASE_URL}/chat/messages?phoneNumber=${encodeURIComponent(phoneNumberGlobal)}&chatId=${chatId}`);
                const data = await res.json();
                if (data.success) {
                    msgArea.innerHTML = "";
                    data.messages.forEach(msg => appendMessageUI(msg, msg.isMe));
                    scrollToBottom();
                } else msgArea.innerHTML = `<div class="text-center text-red-500 mt-4">Failed to load</div>`;
            } catch (e) {}
        }

        function appendMessageUI(msgObj, isMe) {
            if (!msgObj.text && !msgObj.hasMedia) return; 

            const msgArea = document.getElementById('messageArea');
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[75%] rounded-lg p-2 shadow text-sm flex flex-col gap-2 ${isMe ? 'bg-[#d9fdd3] text-gray-800' : 'bg-white text-gray-800'}`;
            
            // 🌟 Media ပါခဲ့ရင် ပုံ (သို့) Video ကို Auto ဖော်ပေးမည်
            if (msgObj.hasMedia) {
                const mediaUrl = `${API_BASE_URL}/chat/media?phoneNumber=${encodeURIComponent(phoneNumberGlobal)}&chatId=${currentChatId}&messageId=${msgObj.id}`;
                if (msgObj.mimeType && msgObj.mimeType.startsWith('video/')) {
                    bubble.innerHTML += `<video src="${mediaUrl}" controls preload="metadata" class="rounded-lg max-h-64 max-w-full bg-black"></video>`;
                } else {
                    bubble.innerHTML += `<img src="${mediaUrl}" alt="Media" class="rounded-lg max-h-64 max-w-full object-cover bg-gray-100" onerror="this.style.display='none'" />`;
                }
            }

            if (msgObj.text) {
                const textSpan = document.createElement('span');
                textSpan.className = "px-2 pb-1 whitespace-pre-wrap break-words";
                textSpan.innerText = msgObj.text;
                bubble.appendChild(textSpan);
            }
            
            wrapper.appendChild(bubble); msgArea.appendChild(wrapper);
        }

        // --- SEND ---
        async function sendMsg() {
            if (!currentChatId) return;
            const inputEl = document.getElementById('msgInput');
            const text = inputEl.value.trim();
            if (!text) return;

            appendMessageUI({ text: text, hasMedia: false }, true);
            inputEl.value = ""; scrollToBottom();

            try {
                await fetch(`${API_BASE_URL}/chat/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phoneNumber: phoneNumberGlobal, chatId: currentChatId, message: text }) });
            } catch (e) {}
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMsg(); }
        function scrollToBottom() { setTimeout(() => { document.getElementById('messageArea').scrollTop = document.getElementById('messageArea').scrollHeight; }, 300); }
        function logout() { localStorage.removeItem('userPhone'); location.reload(); }
    </script>
</body>
</html>
